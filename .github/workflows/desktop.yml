name: Tauri desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Test and verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build:web

  windows-installer:
    name: Windows x64 NSIS and portable
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Test Rust storage layer
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - run: npm run dist:win

      - name: Measure installer size
        id: size
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer nebyl nalezen v release/." }
          $bytes = $installer.Length
          $megabytes = [Math]::Round($bytes / 1MB, 2)
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT
          "megabytes=$megabytes" >> $env:GITHUB_OUTPUT
          "### Windows instalátor`n`n- Soubor: ``$($installer.Name)```n- Velikost: **$megabytes MB ($bytes bajtů)**" >> $env:GITHUB_STEP_SUMMARY
          if ($bytes -gt 24900000) {
            Write-Output "::warning title=Installer exceeds size target::NSIS installer has $bytes bytes ($megabytes MB), limit is 24900000 bytes."
          } else {
            Write-Output "Installer meets the 24,900,000-byte target."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: lol-randomizer-windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attach executables to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = Get-ChildItem release -Filter "*.exe" | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @files --clobber
