name: Desktop CI and multiplatform release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  desktop-packages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win
            artifact_name: lol-randomizer-windows
            artifact_path: release/*.exe
            release_pattern: release/*.exe
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
            artifact_name: lol-randomizer-linux
            artifact_path: |-
              release/*.AppImage
              release/*.deb
            release_pattern: release/*.{AppImage,deb}
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac
            artifact_name: lol-randomizer-macos
            artifact_path: |-
              release/*.dmg
              release/*.zip
            release_pattern: release/*.{dmg,zip}
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Attach packages to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ${{ matrix.release_pattern }} --clobber
