name: Desktop CI and Windows release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  windows-exe:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: lol-randomizer-windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Attach executables to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: Get-ChildItem release -Filter *.exe | ForEach-Object { gh release upload $env:RELEASE_TAG $_.FullName --clobber }
